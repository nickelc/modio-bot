[package]
name = "modbot"
version = "0.9.0"
description = """Discord bot for https://mod.io.
ModBot provides commands to search for mods and notifications about added & edited mods."""
repository = "https://github.com/nickelc/modio-bot"
license = "MIT OR Apache-2.0"
authors = ["Constantin Nickel <constantin.nickel@gmail.com>"]
keywords = ["modio", "discord", "bot"]
edition = "2021"
rust-version = "1.82.0"
include = ["src/**/*.rs", "src/**/*.md", "LICENSE-*", "README.md", "build.rs", "migrations"]

[dependencies]
bitflags = "2.10.0"
bytesize = "2.3.1"
csv = "1.4.0"
dashmap = "6.1.0"
dotenv = "0.15.0"
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }
pico-args = "0.5.0"
prometheus = { version = "0.14.0", default-features = false }
serde = "1.0.228"
serde_derive = "1.0.228"
serde_urlencoded = "0.7.1"
time = { version = "0.3.45", features = ["formatting", "macros"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.18"
toml = "0.9.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "time"] }

# strip html tags
html5ever = "0.37.1"

# metrics
hyper = { version = "1.8.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.19", features = ["tokio"] }
http-body-util = "0.1.3"

# diesel
diesel = { version = "2.3.5", default-features = false, features = ["r2d2", "sqlite"] }
diesel_migrations = "2.3.0"
libsqlite3-sys = { version = ">=0.17.2, <0.36.0", optional = true }

# twilight
twilight-gateway = "0.17.1"
twilight-http = "0.17.1"
twilight-model= "0.17.1"
twilight-cache-inmemory = "0.17.1"
twilight-util = { version = "0.17.0", features = ["builder"] }

[dependencies.modio]
version = "0.14.2"
default-features = false
features = ["rustls-native-roots"]

[build-dependencies]
git2 = { version = "0.20.3", default-features = false }

[features]
sqlite-bundled = ["libsqlite3-sys/bundled"]

[profile.release]
lto = true
